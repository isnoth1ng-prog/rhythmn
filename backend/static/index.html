<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeFlow — Apple Music & Яндекс Музыка</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0A0A0A;
            --bg-sec: #1A1A2E;
            --surface: rgba(30, 30, 46, 0.7);
            --pink: #FF2D55;
            --purple: #AF52DE;
            --text: #FFFFFF;
            --text-sec: rgba(255, 255, 255, 0.6);
            --gradient: linear-gradient(135deg, #FF2D55, #AF52DE);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-sec) 100%); position: relative; padding-bottom: 120px; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
        
        /* Top Navigation Header */
        header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 28px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Search Bar */
        .search-box { margin: 10px 20px; position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 12px; border: none; background: var(--surface); color: white; font-size: 15px; outline: none; backdrop-filter: blur(10px); }
        .search-box i { position: absolute; left: 14px; top: 14px; color: var(--text-sec); font-size: 16px; }

        /* Sections */
        .section-title { font-size: 20px; font-weight: 700; margin: 20px 20px 12px; }
        .horizontal-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        
        /* Cards */
        .track-card { flex: 0 0 150px; cursor: pointer; transition: transform 0.2s; }
        .track-card:active { transform: scale(0.96); }
        .track-card img { width: 150px; height: 150px; border-radius: 14px; object-fit: cover; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .track-card .title { font-size: 14px; font-weight: 600; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-card .artist { font-size: 12px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Track List */
        .track-list { padding: 0 20px; }
        .track-row { display: flex; align-items: center; padding: 8px 0; gap: 12px; cursor: pointer; border-radius: 10px; transition: background 0.2s; }
        .track-row:hover { background: rgba(255,255,255,0.05); }
        .track-row img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .track-row .info { flex: 1; overflow: hidden; }
        .track-row .title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-row .artist { font-size: 13px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-row .duration { font-size: 13px; color: var(--text-sec); font-family: monospace; }

        /* Tabs */
        .view-content { display: none; }
        .view-content.active { display: block; }
        
        /* Tab Bar */
        .tab-bar { position: fixed; bottom: 0; width: 100%; max-width: 480px; height: 60px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .tab-btn { background: none; border: none; color: var(--text-sec); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; cursor: pointer; transition: color 0.2s; }
        .tab-btn i { font-size: 20px; }
        .tab-btn.active { color: var(--pink); }

        /* Mini Player */
        .mini-player { position: fixed; bottom: 65px; width: calc(100% - 24px); max-width: 456px; height: 58px; background: rgba(30, 30, 46, 0.85); backdrop-filter: blur(25px); border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; padding: 0 14px; gap: 12px; z-index: 99; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .mini-progress { position: absolute; top: 0; left: 0; height: 2px; background: var(--gradient); border-radius: 14px 14px 0 0; width: 0%; transition: width 0.3s; }
        .mini-player img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
        .mini-info { flex: 1; overflow: hidden; }
        .mini-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-artist { font-size: 12px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-controls { display: flex; gap: 16px; align-items: center; font-size: 20px; }

        /* Full Player Overlay */
        .full-player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0A0A0A; z-index: 200; display: none; flex-direction: column; padding: 20px 24px 30px; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .full-player.open { display: flex; transform: translateY(0); }
        .full-player-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(70px) brightness(0.35); z-index: -1; transform: scale(1.2); }
        .player-top { display: flex; justify-content: space-between; align-items: center; }
        .dismiss-btn, .lyrics-toggle { background: rgba(255,255,255,0.1); border: none; width: 40px; height: 40px; border-radius: 50%; color: white; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .lyrics-toggle.active { background: var(--pink); }

        .player-center { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; margin: 15px 0; }
        .cover-art { width: 280px; height: 280px; border-radius: 20px; object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6); transition: transform 0.4s; }
        .cover-art.playing { transform: scale(1.03); }

        /* Synced Lyrics */
        .lyrics-container { position: absolute; width: 100%; height: 100%; overflow-y: auto; display: none; flex-direction: column; gap: 20px; padding: 120px 10px 160px; scrollbar-width: none; mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 15%, black 85%, transparent 100%); }
        .lyrics-line { font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.25); cursor: pointer; transition: all 0.3s; text-align: left; }
        .lyrics-line.active { font-size: 26px; font-weight: 800; color: #fff; transform: scale(1.04); text-shadow: 0 0 20px rgba(255,255,255,0.4); }

        /* Progress & Controls */
        .scrubber-container { width: 100%; margin-top: 10px; }
        .scrubber { width: 100%; height: 5px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 3px; outline: none; cursor: pointer; }
        .scrubber::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
        .time-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sec); margin-top: 6px; font-family: monospace; }
        
        .main-controls { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; padding: 0 10px; }
        .ctrl-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .ctrl-btn.active { color: var(--pink); }
        .play-btn { width: 70px; height: 70px; border-radius: 50%; background: var(--gradient); border: none; color: white; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(255, 45, 85, 0.4); }

        /* Wave Tab */
        .wave-view { text-align: center; padding: 40px 20px; }
        .wave-orb { width: 140px; height: 140px; border-radius: 50%; background: var(--gradient); margin: 30px auto; display: flex; align-items: center; justify-content: center; font-size: 60px; box-shadow: 0 0 50px rgba(255, 45, 85, 0.6); animation: pulse 2s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); box-shadow: 0 0 70px rgba(175, 82, 222, 0.8); } }
        .wave-btn { background: var(--gradient); color: white; border: none; padding: 16px 36px; border-radius: 30px; font-size: 17px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 45, 85, 0.4); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Views -->
        <div id="view-home" class="view-content active">
            <header>
                <h1>Главная</h1>
                <i class="fa-solid fa-bell" style="color: var(--text-sec); font-size: 20px;"></i>
            </header>
            
            <div class="section-title">Новинки</div>
            <div class="horizontal-scroll" id="new-releases"></div>
            
            <div class="section-title">Рекомендации</div>
            <div class="track-list" id="recommendations"></div>
        </div>

        <div id="view-search" class="view-content">
            <header>
                <h1>Поиск</h1>
            </header>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Треки, артисты...">
            </div>
            <div class="track-list" id="search-results"></div>
        </div>

        <div id="view-wave" class="view-content">
            <div class="wave-view">
                <h1 style="font-size: 32px; margin-bottom: 8px;">Моя Волна</h1>
                <p style="color: var(--text-sec); font-size: 15px;">Бесконечный персональный поток музыки, подбирающийся на ходу</p>
                <div class="wave-orb">🌊</div>
                <button class="wave-btn" id="start-wave-btn"><i class="fa-solid fa-play"></i> Запустить Волну</button>
                <div class="section-title" style="text-align: left; margin-top: 30px;">Далее в волне</div>
                <div class="track-list" id="wave-tracks"></div>
            </div>
        </div>

        <div id="view-library" class="view-content">
            <header>
                <h1>Библиотека</h1>
            </header>
            <div class="track-list" id="library-tracks">
                <p style="color: var(--text-sec); text-align: center; margin-top: 40px;">Сохранённых треков пока нет.<br>Нажимайте ❤️ в плеере для добавления.</p>
            </div>
        </div>

        <!-- Mini Player -->
        <div class="mini-player" id="mini-player" style="display: none;">
            <div class="mini-progress" id="mini-progress"></div>
            <img src="" id="mini-art">
            <div class="mini-info">
                <div class="mini-title" id="mini-title">Название</div>
                <div class="mini-artist" id="mini-artist">Артист</div>
            </div>
            <div class="mini-controls">
                <i class="fa-solid fa-play" id="mini-play-btn"></i>
                <i class="fa-solid fa-forward-step" id="mini-next-btn"></i>
            </div>
        </div>

        <!-- Full Player -->
        <div class="full-player" id="full-player">
            <div class="full-player-bg" id="player-bg"></div>
            <div class="player-top">
                <button class="dismiss-btn" id="dismiss-player"><i class="fa-solid fa-chevron-down"></i></button>
                <div style="width: 36px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;"></div>
                <button class="lyrics-toggle" id="lyrics-toggle"><i class="fa-solid fa-quote-right"></i></button>
            </div>
            
            <div class="player-center">
                <img src="" class="cover-art" id="player-cover">
                <div class="lyrics-container" id="lyrics-container"></div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div style="overflow: hidden; padding-right: 15px;">
                    <h2 id="player-title" style="font-size: 22px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Название</h2>
                    <p id="player-artist" style="font-size: 16px; color: var(--text-sec); margin-top: 4px;">Артист</p>
                </div>
                <button id="like-btn" style="background: none; border: none; font-size: 26px; color: rgba(255,255,255,0.8); cursor: pointer;"><i class="fa-regular fa-heart"></i></button>
            </div>

            <div class="scrubber-container">
                <input type="range" class="scrubber" id="scrubber" min="0" max="100" value="0">
                <div class="time-labels">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="main-controls">
                <button class="ctrl-btn" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                <button class="ctrl-btn" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-btn" id="main-play-btn"><i class="fa-solid fa-play"></i></button>
                <button class="ctrl-btn" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button class="ctrl-btn" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
            </div>
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="home"><i class="fa-solid fa-house"></i>Главная</button>
            <button class="tab-btn" data-tab="search"><i class="fa-solid fa-magnifying-glass"></i>Поиск</button>
            <button class="tab-btn" data-tab="wave"><i class="fa-solid fa-wave-square"></i>Моя Волна</button>
            <button class="tab-btn" data-tab="library"><i class="fa-solid fa-bookmark"></i>Библиотека</button>
        </div>
    </div>

    <audio id="audio-engine"></audio>

    <script>
        const audio = document.getElementById('audio-engine');
        let currentQueue = [];
        let currentIndex = -1;
        let currentLyrics = [];
        let library = JSON.parse(localStorage.getItem('vibeflow_saved') || '[]');
        let isWaveActive = false;

        // Navigation
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`view-${btn.dataset.tab}`).classList.add('active');
            });
        });

        // Player Overlay
        const miniPlayer = document.getElementById('mini-player');
        const fullPlayer = document.getElementById('full-player');
        miniPlayer.addEventListener('click', (e) => {
            if (!e.target.closest('.mini-controls')) fullPlayer.classList.add('open');
        });
        document.getElementById('dismiss-player').addEventListener('click', () => fullPlayer.classList.remove('open'));

        // Format Seconds
        function fmt(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Fetch Releases
        async function loadHome() {
            try {
                const res = await fetch('/api/new-releases');
                const tracks = await res.json();
                const container = document.getElementById('new-releases');
                container.innerHTML = tracks.slice(0, 10).map((t, i) => `
                    <div class="track-card" onclick="playTrackFromList('new', ${i})">
                        <img src="${t.thumbnailUrl}">
                        <div class="title">${t.title}</div>
                        <div class="artist">${t.artist}</div>
                    </div>
                `).join('');
                window.newReleases = tracks;

                const recRes = await fetch('/api/recommendations');
                const recTracks = await recRes.json();
                const recContainer = document.getElementById('recommendations');
                recContainer.innerHTML = recTracks.map((t, i) => `
                    <div class="track-row" onclick="playTrackFromList('rec', ${i})">
                        <img src="${t.thumbnailUrl}">
                        <div class="info">
                            <div class="title">${t.title}</div>
                            <div class="artist">${t.artist}</div>
                        </div>
                        <div class="duration">${fmt(t.duration)}</div>
                    </div>
                `).join('');
                window.recTracks = recTracks;
            } catch (e) { console.error(e); }
        }

        function playTrackFromList(type, idx) {
            if (type === 'new') currentQueue = window.newReleases;
            if (type === 'rec') currentQueue = window.recTracks;
            if (type === 'search') currentQueue = window.searchResults;
            if (type === 'wave') currentQueue = window.waveQueue;
            playIndex(idx);
        }

        async function playIndex(idx) {
            if (idx < 0 || idx >= currentQueue.length) return;
            currentIndex = idx;
            const track = currentQueue[currentIndex];

            // Update UI
            document.getElementById('mini-title').textContent = track.title;
            document.getElementById('mini-artist').textContent = track.artist;
            document.getElementById('mini-art').src = track.thumbnailUrl;
            document.getElementById('player-title').textContent = track.title;
            document.getElementById('player-artist').textContent = track.artist;
            document.getElementById('player-cover').src = track.thumbnailUrl;
            document.getElementById('player-bg').style.backgroundImage = `url(${track.thumbnailUrl})`;
            miniPlayer.style.display = 'flex';
            updateLikeButton(track);

            // Fetch Stream URL
            try {
                const sRes = await fetch(`/api/stream/${track.id}`);
                const sData = await sRes.json();
                audio.src = sData.streamUrl;
                audio.play();
                setPlayIcon(true);
            } catch (e) { console.error('Stream error', e); }

            // Load Lyrics
            loadLyrics(track);
        }

        async function loadLyrics(track) {
            currentLyrics = [];
            const lContainer = document.getElementById('lyrics-container');
            lContainer.innerHTML = '<div style="color: var(--text-sec); text-align: center; margin-top: 50px;">Загрузка текста...</div>';
            try {
                const res = await fetch(`/api/lyrics?title=${encodeURIComponent(track.title)}&artist=${encodeURIComponent(track.artist)}&duration=${track.duration}`);
                const data = await res.json();
                if (data.synced && data.lines && data.lines.length > 0) {
                    currentLyrics = data.lines;
                    lContainer.innerHTML = currentLyrics.map((l, i) => `
                        <div class="lyrics-line" id="l-${i}" onclick="audio.currentTime = ${l.time}">${l.text}</div>
                    `).join('');
                } else if (data.plainText) {
                    lContainer.innerHTML = `<div style="font-size: 18px; line-height: 1.6; color: rgba(255,255,255,0.85);">${data.plainText.replace(/\n/g, '<br>')}</div>`;
                } else {
                    lContainer.innerHTML = '<div style="color: var(--text-sec); text-align: center; margin-top: 50px;">Текст песни недоступен</div>';
                }
            } catch (e) {
                lContainer.innerHTML = '<div style="color: var(--text-sec); text-align: center; margin-top: 50px;">Текст песни недоступен</div>';
            }
        }

        // Lyrics Sync Highlight (Apple Music style)
        audio.ontimeupdate = () => {
            const cur = audio.currentTime;
            const dur = audio.duration || 1;
            document.getElementById('mini-progress').style.width = `${(cur / dur) * 100}%`;
            document.getElementById('scrubber').value = (cur / dur) * 100;
            document.getElementById('current-time').textContent = fmt(cur);
            document.getElementById('total-time').textContent = fmt(dur);

            if (currentLyrics.length > 0) {
                let activeIdx = 0;
                for (let i = 0; i < currentLyrics.length; i++) {
                    if (cur >= currentLyrics[i].time) activeIdx = i;
                    else break;
                }
                document.querySelectorAll('.lyrics-line').forEach((el, i) => {
                    if (i === activeIdx) {
                        if (!el.classList.contains('active')) {
                            el.classList.add('active');
                            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    } else {
                        el.classList.remove('active');
                    }
                });
            }
        };

        // Lyrics Toggle Button
        const lyricsBtn = document.getElementById('lyrics-toggle');
        const coverArt = document.getElementById('player-cover');
        const lyricsBox = document.getElementById('lyrics-container');
        lyricsBtn.addEventListener('click', () => {
            const active = lyricsBtn.classList.toggle('active');
            if (active) {
                coverArt.style.display = 'none';
                lyricsBox.style.display = 'flex';
            } else {
                coverArt.style.display = 'block';
                lyricsBox.style.display = 'none';
            }
        });

        // Controls
        function setPlayIcon(isPlaying) {
            document.getElementById('mini-play-btn').className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
            document.getElementById('main-play-btn').innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        }

        function togglePlay() {
            if (audio.paused) { audio.play(); setPlayIcon(true); }
            else { audio.pause(); setPlayIcon(false); }
        }

        document.getElementById('mini-play-btn').onclick = (e) => { e.stopPropagation(); togglePlay(); };
        document.getElementById('main-play-btn').onclick = togglePlay;
        document.getElementById('mini-next-btn').onclick = (e) => { e.stopPropagation(); playNext(); };
        document.getElementById('next-btn').onclick = playNext;
        document.getElementById('prev-btn').onclick = () => {
            if (audio.currentTime > 3) audio.currentTime = 0;
            else if (currentIndex > 0) playIndex(currentIndex - 1);
        };

        function playNext() {
            if (currentIndex < currentQueue.length - 1) playIndex(currentIndex + 1);
            else if (isWaveActive) fetchMoreWave();
        }

        audio.onended = playNext;

        document.getElementById('scrubber').oninput = (e) => {
            if (audio.duration) audio.currentTime = (e.target.value / 100) * audio.duration;
        };

        // Search
        let debounceTimer;
        document.getElementById('search-input').oninput = (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(async () => {
                const q = e.target.value.trim();
                if (!q) return;
                const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&type=tracks`);
                const data = await res.json();
                window.searchResults = data.tracks;
                document.getElementById('search-results').innerHTML = data.tracks.map((t, i) => `
                    <div class="track-row" onclick="playTrackFromList('search', ${i})">
                        <img src="${t.thumbnailUrl}">
                        <div class="info">
                            <div class="title">${t.title}</div>
                            <div class="artist">${t.artist}</div>
                        </div>
                        <div class="duration">${fmt(t.duration)}</div>
                    </div>
                `).join('');
            }, 400);
        };

        // My Wave
        document.getElementById('start-wave-btn').onclick = async () => {
            isWaveActive = true;
            document.getElementById('start-wave-btn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Подбор треков...';
            const res = await fetch('/api/wave/next', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: 12, history: [] })
            });
            const tracks = await res.json();
            window.waveQueue = tracks;
            document.getElementById('start-wave-btn').innerHTML = '<i class="fa-solid fa-shuffle"></i> Волна активна';
            document.getElementById('wave-tracks').innerHTML = tracks.map((t, i) => `
                <div class="track-row" onclick="playTrackFromList('wave', ${i})">
                    <img src="${t.thumbnailUrl}">
                    <div class="info">
                        <div class="title">${t.title}</div>
                        <div class="artist">${t.artist}</div>
                    </div>
                    <div class="duration">${fmt(t.duration)}</div>
                </div>
            `).join('');
            playTrackFromList('wave', 0);
        };

        async function fetchMoreWave() {
            const res = await fetch('/api/wave/next', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: 8, seedTrackIds: [currentQueue[currentIndex].id] })
            });
            const more = await res.json();
            currentQueue.push(...more);
            playIndex(currentIndex + 1);
        }

        // Library (LocalStorage)
        function updateLikeButton(track) {
            const isLiked = library.some(t => t.id === track.id);
            document.getElementById('like-btn').innerHTML = isLiked ? '<i class="fa-solid fa-heart" style="color: var(--pink);"></i>' : '<i class="fa-regular fa-heart"></i>';
        }

        document.getElementById('like-btn').onclick = () => {
            if (currentIndex < 0) return;
            const track = currentQueue[currentIndex];
            const idx = library.findIndex(t => t.id === track.id);
            if (idx >= 0) library.splice(idx, 1);
            else library.push(track);
            localStorage.setItem('vibeflow_saved', JSON.stringify(library));
            updateLikeButton(track);
        };

        loadHome();
    </script>
</body>
</html>
