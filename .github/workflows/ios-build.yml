name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate app icon
        run: swift Scripts/generate_app_icon.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA for Sideloadly
        run: |
          cd build-device/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R Rhythm.app Payload/

          # Compile LaunchScreen storyboard into the app bundle if not already compiled
          if [ ! -d "Payload/Rhythm.app/LaunchScreen.storyboardc" ]; then
            echo "Compiling LaunchScreen.storyboard..."
            ibtool --compile Payload/Rhythm.app/LaunchScreen.storyboardc "$GITHUB_WORKSPACE/Sources/Rhythm/LaunchScreen.storyboard" || true
          fi

          # Ensure full-screen edge-to-edge support, background audio, and ATS in Info.plist
          PLIST="Payload/Rhythm.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSAppTransportSecurity:NSAllowsArbitraryLoads true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true

          echo "Inspecting final Info.plist launch & audio configuration:"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" || true

          zip -qry Rhythm.ipa Payload
          echo "IPA created successfully:"
          ls -lh Rhythm.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-IPA
          path: build-device/Build/Products/Release-iphoneos/Rhythm.ipa
          retention-days: 30

      - name: Build Simulator app (Debug)
        run: |
          xcodebuild build \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          cd build-simulator/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Rhythm.app Rhythm-Simulator.zip

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-Simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/Rhythm-Simulator.zip
          retention-days: 14
