name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate app icon
        run: swift Scripts/generate_app_icon.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project Rhythm.xcodeproj
          -scheme Rhythm
          -sdk iphonesimulator
          -configuration Debug
          -derivedDataPath build-simulator
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package simulator app
        run: |
          cd build-simulator/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Rhythm.app Rhythm-Simulator.zip

      - name: Build iPhone app
        run: >-
          xcodebuild
          -project Rhythm.xcodeproj
          -scheme Rhythm
          -sdk iphoneos
          -configuration Release
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Validate installable app bundles
        run: |
          APP="build-device/Build/Products/Release-iphoneos/Rhythm.app"
          APP_PLIST="$APP/Info.plist"
          EXT="$APP/PlugIns/RhythmWidget.appex"
          EXT_PLIST="$EXT/Info.plist"
          test -x "$APP/Rhythm"
          test -x "$EXT/RhythmWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PLIST")" = "com.isnoth1ngprog.rhythmn"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PLIST")" = "Rhythm"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")" = "1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_PLIST")" = "com.isnoth1ngprog.rhythmn.widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT_PLIST")" = "RhythmWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXT_PLIST")" = "1"

      - name: Package unsigned IPA for Sideloadly
        run: |
          cd build-device/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R Rhythm.app Payload/
          /usr/bin/zip -qry Rhythm-unsigned.ipa Payload
          /usr/bin/unzip -l Rhythm-unsigned.ipa | head -30

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-iphone-ipa
          path: build-device/Build/Products/Release-iphoneos/Rhythm-unsigned.ipa
          retention-days: 14

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: rhythm-ios-simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/Rhythm-Simulator.zip
          retention-days: 14
