name: Build iOS IPA (Sideloadly)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS Application (Release)
        run: |
          xcodebuild build \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA for Sideloadly
        run: |
          cd build-device/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R Rhythm.app Payload/
          zip -qry Rhythm.ipa Payload
          echo "IPA created successfully:"
          ls -lh Rhythm.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-IPA
          path: build-device/Build/Products/Release-iphoneos/Rhythm.ipa
          retention-days: 30

      - name: Build Simulator app (Debug)
        run: |
          xcodebuild build \
            -project Rhythm.xcodeproj \
            -scheme Rhythm \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build-simulator \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          cd build-simulator/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Rhythm.app Rhythm-Simulator.zip

      - name: Upload Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-Simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/Rhythm-Simulator.zip
          retention-days: 14
