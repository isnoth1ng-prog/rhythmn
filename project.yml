name: Rhythm
options:
  bundleIdPrefix: com.isnoth1ngprog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rhythm:
    type: application
    platform: iOS
    sources:
      - path: Sources/Rhythm
    dependencies:
      - target: RhythmWidget
        embed: true
    info:
      path: Config/Rhythm-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ngprog.rhythmn
        PRODUCT_NAME: Rhythm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - RhythmTests
  RhythmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RhythmTests
    dependencies:
      - target: Rhythm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ngprog.rhythmn.tests
        CODE_SIGNING_ALLOWED: NO
  RhythmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/RhythmWidget
      - path: Sources/Rhythm/RhythmPlaybackAttributes.swift
    info:
      path: Config/RhythmWidget-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ngprog.rhythmn.widget
        PRODUCT_NAME: RhythmWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
