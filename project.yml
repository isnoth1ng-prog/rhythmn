name: Rhythm
options:
  bundleIdPrefix: com.isnoth1ngprog
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rhythm:
    type: application
    platform: iOS
    sources:
      - path: Sources/Rhythm
    info:
      path: Config/Rhythm-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ngprog.rhythmn
        PRODUCT_NAME: Rhythm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
