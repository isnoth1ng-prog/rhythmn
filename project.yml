name: Rhythm
options:
  bundleIdPrefix: com.isnoth1ngprog
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Rhythm:
    type: application
    platform: iOS
    sources:
      - path: Sources/Rhythm
    dependencies:
      - target: RhythmWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ngprog.rhythmn
        PRODUCT_NAME: Rhythm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Config/Rhythm-Info.plist
        CODE_SIGNING_ALLOWED: NO
  RhythmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/RhythmWidget
      - path: Sources/Rhythm/RhythmPlaybackAttributes.swift
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isnoth1ngprog.rhythmn.widget
        PRODUCT_NAME: RhythmWidget
        INFOPLIST_FILE: Config/RhythmWidget-Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
